# 每個交易日下午自動抓台股收盤價，存成網站上的 quotes.json，
# 記帳本的「更新台股收盤價」會先讀這個檔案（瀏覽器不能直接連證交所）。
name: 更新台股收盤價
on:
  schedule:
    - cron: "10 6,9 * * 1-5"   # 台灣時間週一到週五 14:10、17:10
  workflow_dispatch:            # 也可以在 Actions 頁面手動按「Run workflow」
permissions:
  contents: write
jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下載收盤價
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          def get(u):
              req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)
          def roc(s):
              s = str(s or "").replace("/", "")
              return f"{int(s[:3]) + 1911}-{s[3:5]}-{s[5:7]}" if len(s) == 7 and s.isdigit() else ""
          q, d = {}, ""
          try:
              for x in get("https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL"):
                  try: p = float(x.get("ClosingPrice") or 0)
                  except ValueError: p = 0
                  if x.get("Code") and p > 0:
                      q[x["Code"].upper()] = [p, x.get("Name", "")]; d = d or roc(x.get("Date"))
          except Exception as e: print("TWSE 失敗：", e)
          try:
              for x in get("https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes"):
                  c = str(x.get("SecuritiesCompanyCode") or "").upper()
                  try: p = float(x.get("Close") or 0)
                  except ValueError: p = 0
                  if c and p > 0 and c not in q:
                      q[c] = [p, x.get("CompanyName", "")]; d = d or roc(x.get("Date"))
          except Exception as e: print("TPEx 失敗：", e)
          if len(q) < 100: raise SystemExit("抓到的股價太少，這次先不更新")
          now = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).strftime("%Y-%m-%d %H:%M")
          with open("quotes.json", "w", encoding="utf-8") as f:
              json.dump({"at": now, "d": d, "q": q}, f, ensure_ascii=False, separators=(",", ":"))
          print("共", len(q), "檔，收盤日", d)
          PY
      - name: 存到網站
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git diff --cached --quiet || (git commit -m "更新台股收盤價" && git push)
 
